<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Arka oda (olay yeri fotoğrafı)</title>
    <!--
  Statik, betiksiz sahne: 344 × 300 sahne birimi (SceneDef sc_arka). Yalnızca dekoratif div'ler.
  Palet: zemin #141026, duvar #2b2350, kenar #120d1c, metin #efe8ff.
-->
    <style>
      body { margin: 0; background: #141026; }
      #scene { position: relative; width: 344px; height: 300px; overflow: hidden; background: #141026; }
      #scene div { position: absolute; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- duvar ve zemin -->
      <div style="left: 0; right: 0; top: 0; height: 196px; background: #2b2350"></div>
      <div style="left: 0; right: 0; top: 196px; bottom: 0; background: #3a2f4a; border-top: 4px solid #120d1c"></div>
      <div style="left: 0; right: 0; top: 230px; height: 2px; background: #2e2540"></div>
      <div style="left: 0; right: 0; top: 262px; height: 2px; background: #2e2540"></div>
      <!-- pencere, yağmur -->
      <div style="left: 210px; top: 26px; width: 50px; height: 60px; background: #1b2440; border: 3px solid #120d1c"></div>
      <div style="left: 222px; top: 32px; width: 2px; height: 48px; background: #4a5a86"></div>
      <div style="left: 240px; top: 40px; width: 2px; height: 40px; background: #4a5a86"></div>
      <!-- dolap (boş, kapakları açık) -->
      <div style="left: 20px; top: 40px; width: 90px; height: 150px; background: #4a3a2a; border: 3px solid #120d1c"></div>
      <div style="left: 28px; top: 50px; width: 74px; height: 130px; background: #1a1410"></div>
      <div style="left: 28px; top: 100px; width: 74px; height: 4px; background: #4a3a2a"></div>
      <div style="left: 6px; top: 44px; width: 14px; height: 142px; background: #5a4632; border: 2px solid #120d1c"></div>
      <!-- poster -->
      <div style="left: 126px; top: 36px; width: 60px; height: 50px; background: #2f5a96; border: 3px solid #120d1c"></div>
      <div style="left: 140px; top: 48px; width: 32px; height: 26px; background: #e8b13c"></div>
      <!-- kask askısı (boş) -->
      <div style="left: 200px; top: 104px; width: 10px; height: 14px; background: #7d8590; border: 2px solid #120d1c"></div>
      <!-- sandalye ve mont -->
      <div style="left: 150px; top: 150px; width: 48px; height: 8px; background: #5a4632; border: 2px solid #120d1c"></div>
      <div style="left: 152px; top: 158px; width: 6px; height: 40px; background: #5a4632"></div>
      <div style="left: 190px; top: 158px; width: 6px; height: 40px; background: #5a4632"></div>
      <div style="left: 146px; top: 118px; width: 56px; height: 52px; background: #e2802f; border: 3px solid #120d1c"></div>
      <div style="left: 150px; top: 140px; width: 48px; height: 5px; background: #f4efe6"></div>
      <div style="left: 166px; top: 124px; width: 16px; height: 10px; background: #a8521b"></div>
      <!-- yatak -->
      <div style="left: 186px; top: 206px; width: 132px; height: 56px; background: #45306a; border: 3px solid #120d1c"></div>
      <div style="left: 290px; top: 210px; width: 24px; height: 18px; background: #cfc9c1"></div>
      <div style="left: 196px; top: 262px; width: 116px; height: 26px; background: #120d1c"></div>
      <!-- zincir kilit -->
      <div style="left: 204px; top: 272px; width: 54px; height: 6px; background: #b0b8c4; border: 1px solid #120d1c"></div>
      <div style="left: 256px; top: 268px; width: 8px; height: 12px; background: #e8b13c"></div>
      <!-- kapı ve kesik kilit -->
      <div style="left: 268px; top: 52px; width: 62px; height: 144px; background: #5a4632; border: 3px solid #120d1c"></div>
      <div style="left: 274px; top: 120px; width: 12px; height: 6px; background: #b0b8c4"></div>
      <div style="left: 280px; top: 242px; width: 14px; height: 14px; border: 4px solid #b0b8c4; border-bottom-color: transparent; border-radius: 8px 8px 0 0"></div>
      <div style="left: 294px; top: 248px; width: 16px; height: 12px; background: #7d8590; border: 2px solid #120d1c"></div>
      <!-- flaş lekesi -->
      <div style="left: 0; top: 0; width: 344px; height: 300px; background: radial-gradient(circle at 60% 40%, rgba(255,255,255,0.06), rgba(0,0,0,0) 60%)"></div>
    </div>
  </body>
</html>
