<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Gökdere Sokağı</title>
    <!--
  Statik, betiksiz sahne: 344 × 300 (SceneDef sc_sokak). Solda nöbetçi eczane ve kamerası, ortada Gölge’nin
  kepengi ve sönük tabelası, sağda arka sokak kapısı, önde taksi durağı. Dokunma alanları SceneDef nesnelerindedir.
-->
    <style>
      body { margin: 0; background: #141026; }
      #scene { position: relative; width: 344px; height: 300px; overflow: hidden; background: #141026; }
      #scene div { position: absolute; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="scene">
      <div style="left: 0; right: 0; top: 0; height: 190px; background: #1d1838"></div>
      <div style="left: 0; right: 0; top: 190px; bottom: 0; background: #25222e; border-top: 3px solid #120d1c"></div>
      <div style="left: 0; right: 0; top: 250px; height: 50px; background: #2c3e66; opacity: 0.6"></div>
      <!-- eczane -->
      <div style="left: 10px; top: 60px; width: 92px; height: 130px; background: #2b2350; border: 3px solid #120d1c"></div>
      <div style="left: 18px; top: 40px; width: 76px; height: 20px; background: #3f8a62; border: 2px solid #120d1c"></div>
      <div style="left: 50px; top: 44px; width: 12px; height: 12px; background: #f4efe6"></div>
      <div style="left: 70px; top: 64px; width: 14px; height: 10px; background: #25222e; border: 2px solid #120d1c"></div>
      <div style="left: 84px; top: 68px; width: 4px; height: 3px; background: #c4413a"></div>
      <div style="left: 22px; top: 90px; width: 68px; height: 60px; background: #9cc3e6; opacity: 0.4"></div>
      <!-- Gölge -->
      <div style="left: 120px; top: 70px; width: 110px; height: 120px; background: #2b2350; border: 3px solid #120d1c"></div>
      <div style="left: 128px; top: 52px; width: 94px; height: 18px; background: #120d1c"></div>
      <div style="left: 134px; top: 56px; width: 8px; height: 10px; background: #4a4656"></div>
      <div style="left: 146px; top: 56px; width: 70px; height: 10px; background: #e6c46a; opacity: 0.7"></div>
      <div style="left: 128px; top: 110px; width: 94px; height: 80px; background: #5c5a66"></div>
      <div style="left: 128px; top: 118px; width: 94px; height: 2px; background: #4a4656"></div>
      <div style="left: 128px; top: 128px; width: 94px; height: 2px; background: #4a4656"></div>
      <div style="left: 128px; top: 138px; width: 94px; height: 2px; background: #4a4656"></div>
      <div style="left: 150px; top: 150px; width: 50px; height: 14px; background: #f4efe6"></div>
      <!-- arka sokak -->
      <div style="left: 240px; top: 80px; width: 104px; height: 110px; background: #120d1c"></div>
      <div style="left: 256px; top: 120px; width: 40px; height: 70px; background: #3b2f2a; border: 3px solid #120d1c"></div>
      <div style="left: 288px; top: 152px; width: 4px; height: 4px; background: #e6c46a"></div>
      <div style="left: 270px; top: 196px; width: 6px; height: 3px; background: #b0496b"></div>
      <!-- lamba ve yağmur -->
      <div style="left: 232px; top: 20px; width: 4px; height: 170px; background: #4a4656"></div>
      <div style="left: 222px; top: 16px; width: 24px; height: 8px; background: #e6c46a"></div>
      <div style="left: 40px; top: 10px; width: 1px; height: 12px; background: #9cc3e6"></div>
      <div style="left: 110px; top: 30px; width: 1px; height: 12px; background: #9cc3e6"></div>
      <div style="left: 190px; top: 14px; width: 1px; height: 12px; background: #9cc3e6"></div>
      <div style="left: 300px; top: 40px; width: 1px; height: 12px; background: #9cc3e6"></div>
      <!-- taksi durağı -->
      <div style="left: 138px; top: 204px; width: 66px; height: 40px; background: #e8b13c; border: 3px solid #120d1c"></div>
      <div style="left: 150px; top: 214px; width: 42px; height: 8px; background: #120d1c"></div>
    </div>
  </body>
</html>
