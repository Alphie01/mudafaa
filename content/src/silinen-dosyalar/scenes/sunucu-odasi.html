<!doctype html>
<html lang="tr">
<head>

<title>Sahne · Sunucu odası (18 Ekim fotoğrafları)</title>
<!--
  Dava #13: şikâyet ekindeki sunucu odası fotoğrafı. Dekoratif div'ler; dokunma alanları SceneDef nesneleridir

-->

#scene{position:relative;width:344px;height:380px;overflow:hidden;background:#141026;font-family:'Pixelify Sans',monospace;color:#efe8ff}
#scene div{position:absolute;box-sizing:border-box}
</style>
</head>

</html>
