<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Kalem Sokak 9, yanık ev</title>
    <!--
  Statik, betiksiz sahne: 344 × 300 sahne birimi (SceneDef sc_ev). Yalnızca dekoratif div'ler.
  Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- gökyüzüne açılmış tavan, kararmış duvarlar -->
      <div style="left: 0px; top: 0px; width: 344px; height: 30px; background: #1b2440"></div>
      <div style="left: 30px; top: 8px; width: 2px; height: 22px; background: #4a5a86"></div>
      <div style="left: 120px; top: 4px; width: 2px; height: 26px; background: #4a5a86"></div>
      <div style="left: 260px; top: 10px; width: 2px; height: 20px; background: #4a5a86"></div>
      <div style="left: 0px; top: 30px; width: 344px; height: 170px; background: #231c33"></div>
      <div style="left: 0px; top: 26px; width: 344px; height: 6px; background: #120d1c"></div>
      <div style="left: 60px; top: 26px; width: 8px; height: 40px; background: #120d1c"></div>

      <div style="left: 0px; top: 272px; width: 344px; height: 2px; background: #1c1624"></div>
      <!-- cumba (çatlak camlar) -->
      <div
        style="left: 16px; top: 36px; width: 84px; height: 92px; background: #1b2440; border: 4px solid #120d1c"
      ></div>
      <div style="left: 56px; top: 36px; width: 3px; height: 92px; background: #120d1c"></div>
      <div style="left: 16px; top: 80px; width: 84px; height: 3px; background: #120d1c"></div>
      <div style="left: 24px; top: 46px; width: 22px; height: 2px; background: #7d8590; transform: rotate(30deg)"></div>
      <div
        style="left: 64px; top: 96px; width: 26px; height: 2px; background: #7d8590; transform: rotate(-25deg)"
      ></div>
      <!-- koridor duvarı ve buat -->

      <div

      <div style="left: 134px; top: 150px; width: 4px; height: 10px; background: #c96f2a"></div>

      <div
        style="
          left: 240px;
          top: 62px;
          width: 36px;
          height: 90px;
          background: #120d1c;
          clip-path: polygon(0 0, 100% 0, 60% 100%, 40% 100%);
        "
      ></div>
      <div style="left: 254px; top: 150px; width: 8px; height: 10px; background: #cfc9c1"></div>

      <div
        style="left: 118px; top: 250px; width: 40px; height: 3px; background: #7d8590; transform: rotate(-8deg)"
      ></div>
      <!-- kömürleşmiş dikiş masası -->
      <div
        style="left: 196px; top: 214px; width: 76px; height: 14px; background: #2b2018; border: 2px solid #120d1c"
      ></div>
      <div style="left: 204px; top: 228px; width: 4px; height: 28px; background: #25222e"></div>
      <div style="left: 258px; top: 228px; width: 4px; height: 28px; background: #25222e"></div>
      <div style="left: 226px; top: 204px; width: 20px; height: 10px; background: #3a2f2a"></div>
      <!-- duman izi -->
      <div style="left: 310px; top: 120px; width: 24px; height: 70px; background: #2b2350; opacity: 0.6"></div>
    </div>
  </body>
</html>
