<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Toker Balık ofisi · olay yeri fotoğrafları</title>
    <!--
  Dava #15: Toker Balık ofisi · olay yeri fotoğrafları. Dokunma alanları SceneDef nesneleridir: bıçak (150,270,70,40) · önlük (14,90,50,120) · not bloğu (170,150,56,40) · ortak (272,60,60,130) · kadeh (240,150,26,40) · kayıt cihazı (90,24,60,34) · akvaryum (80,300,60,50).
  Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 380px;
        overflow: hidden;
        background: #141026;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- duvar, halı -->
      <div style="left: 0px; top: 0px; width: 344px; height: 250px; background: #2b2350"></div>
      <div
        style="left: 0px; top: 246px; width: 344px; height: 134px; background: #4a2a2e; border: 4px solid #120d1c"
      ></div>
      <div
        style="left: 60px; top: 262px; width: 240px; height: 100px; background: #7d2e48; border: 3px solid #120d1c"
      ></div>
      <div
        style="left: 72px; top: 274px; width: 216px; height: 76px; background: transparent; border: 2px dashed #e8b13c"
      ></div>
      <!-- raf ve kayıt cihazı (90,24,60,34) -->
      <div
        style="left: 70px; top: 56px; width: 120px; height: 6px; background: #6e4a32; border: 2px solid #120d1c"
      ></div>
      <div
        style="left: 92px; top: 26px; width: 56px; height: 30px; background: #25222e; border: 3px solid #120d1c"
      ></div>
      <div style="left: 100px; top: 36px; width: 6px; height: 6px; background: #4a4656; border-radius: 50%"></div>
      <div style="left: 110px; top: 36px; width: 30px; height: 4px; background: #4a4656"></div>
      <!-- koridor askısı ve önlük (14,90,50,120) -->
      <div
        style="left: 10px; top: 84px; width: 58px; height: 6px; background: #6e4a32; border: 2px solid #120d1c"
      ></div>
      <div
        style="left: 20px; top: 92px; width: 38px; height: 110px; background: #f4efe6; border: 3px solid #120d1c"
      ></div>
      <div style="left: 28px; top: 100px; width: 22px; height: 10px; background: #cfc9c1"></div>
      <!-- masa, not bloğu (170,150,56,40), kadeh (240,150,26,40) -->
      <div
        style="left: 140px; top: 186px; width: 160px; height: 60px; background: #6e4a32; border: 4px solid #120d1c"
      ></div>
      <div
        style="left: 172px; top: 154px; width: 50px; height: 34px; background: #f4efe6; border: 2px solid #120d1c"
      ></div>
      <div style="left: 172px; top: 152px; width: 50px; height: 4px; background: #7d8590"></div>
      <div
        style="
          left: 244px;
          top: 156px;
          width: 16px;
          height: 30px;
          background: rgba(156, 195, 230, 0.7);
          border: 2px solid #120d1c;
        "
      ></div>
      <div style="left: 246px; top: 166px; width: 12px; height: 18px; background: #f4efe6"></div>
      <!-- halıdaki bıçak (150,270,70,40) ve tebeşir çizgisi -->
      <div
        style="
          left: 120px;
          top: 300px;
          width: 140px;
          height: 46px;
          background: transparent;
          border: 2px dashed #efe8ff;
          border-radius: 40%;
        "
      ></div>
      <div
        style="left: 156px; top: 284px; width: 50px; height: 6px; background: #cfc9c1; border: 1px solid #120d1c"
      ></div>
      <div
        style="left: 204px; top: 282px; width: 14px; height: 10px; background: #3a2a24; border: 1px solid #120d1c"
      ></div>
      <!-- akvaryum (80,300,60,50) -->
      <div
        style="left: 82px; top: 304px; width: 56px; height: 44px; background: #2f5a96; border: 3px solid #120d1c"
      ></div>
      <div style="left: 96px; top: 320px; width: 10px; height: 6px; background: #e2802f"></div>
      <div style="left: 116px; top: 330px; width: 10px; height: 6px; background: #e8b13c"></div>
      <!-- şeridin dışında beyaz gömlekli ortak (272,60,60,130) -->
      <div style="left: 264px; top: 0px; width: 4px; height: 250px; background: #e8b13c"></div>
      <div
        style="
          left: 286px;
          top: 70px;
          width: 32px;
          height: 30px;
          background: #f2b38a;
          border: 2px solid #120d1c;
          border-radius: 40%;
        "
      ></div>
      <div
        style="left: 280px; top: 100px; width: 44px; height: 70px; background: #f4efe6; border: 2px solid #120d1c"
      ></div>
      <div style="left: 284px; top: 170px; width: 16px; height: 20px; background: #1c2846"></div>
      <div style="left: 304px; top: 170px; width: 16px; height: 20px; background: #1c2846"></div>
    </div>
  </body>
</html>
