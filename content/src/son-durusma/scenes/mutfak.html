<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Toker Balık mutfağı</title>
    <!--
  Dava #15: Toker Balık mutfağı. Dokunma alanları SceneDef nesneleridir: tahta (20,30,120,80) · istasyon (160,170,90,50) · arka kapı (270,60,60,150) · kasa (20,250,80,60) · dolaplar (150,30,100,90) · buz makinesi (150,300,100,60).
  Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 380px;
        overflow: hidden;
        background: #141026;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- fayans duvar, zemin -->
      <div style="left: 0px; top: 0px; width: 344px; height: 240px; background: #cfc9c1"></div>
      <div
        style="
          left: 0px;
          top: 0px;
          width: 344px;
          height: 240px;
          background: repeating-linear-gradient(90deg, rgba(18, 13, 28, 0.15) 0 2px, transparent 2px 24px);
        "
      ></div>
      <div
        style="left: 0px; top: 236px; width: 344px; height: 144px; background: #4a4656; border: 4px solid #120d1c"
      ></div>
      <!-- beyaz tahta (20,30,120,80) -->
      <div
        style="left: 20px; top: 30px; width: 120px; height: 80px; background: #f4efe6; border: 4px solid #120d1c"
      ></div>
      <div style="left: 30px; top: 44px; width: 90px; height: 6px; background: #c4413a"></div>
      <div style="left: 30px; top: 60px; width: 70px; height: 4px; background: #2f5a96"></div>
      <div style="left: 30px; top: 72px; width: 80px; height: 4px; background: #2f5a96"></div>
      <div style="left: 30px; top: 84px; width: 60px; height: 4px; background: #2f5a96"></div>
      <!-- personel dolapları (150,30,100,90) -->
      <div
        style="left: 150px; top: 30px; width: 24px; height: 90px; background: #7d8590; border: 2px solid #120d1c"
      ></div>
      <div style="left: 156px; top: 70px; width: 4px; height: 10px; background: #120d1c"></div>
      <div
        style="left: 175px; top: 30px; width: 24px; height: 90px; background: #7d8590; border: 2px solid #120d1c"
      ></div>
      <div style="left: 181px; top: 70px; width: 4px; height: 10px; background: #120d1c"></div>
      <div
        style="left: 200px; top: 30px; width: 24px; height: 90px; background: #7d8590; border: 2px solid #120d1c"
      ></div>
      <div style="left: 206px; top: 70px; width: 4px; height: 10px; background: #120d1c"></div>
      <div
        style="left: 225px; top: 30px; width: 24px; height: 90px; background: #7d8590; border: 2px solid #120d1c"
      ></div>
      <div style="left: 231px; top: 70px; width: 4px; height: 10px; background: #120d1c"></div>
      <!-- arka kapı (270,60,60,150) -->
      <div
        style="left: 270px; top: 60px; width: 60px; height: 176px; background: #3a2a24; border: 4px solid #120d1c"
      ></div>
      <div
        style="
          left: 278px;
          top: 70px;
          width: 44px;
          height: 50px;
          background: rgba(156, 195, 230, 0.35);
          border: 2px solid #120d1c;
        "
      ></div>
      <div style="left: 316px; top: 150px; width: 8px; height: 8px; background: #e8b13c; border-radius: 50%"></div>
      <!-- tezgâh ve Emir’in istasyonu (160,170,90,50) -->
      <div
        style="left: 120px; top: 196px; width: 150px; height: 40px; background: #9cc3e6; border: 3px solid #120d1c"
      ></div>
      <div
        style="left: 168px; top: 176px; width: 70px; height: 22px; background: #b08463; border: 2px solid #120d1c"
      ></div>
      <div style="left: 176px; top: 182px; width: 40px; height: 4px; background: #cfc9c1"></div>
      <!-- kasa (20,250,80,60) -->
      <div
        style="left: 20px; top: 254px; width: 80px; height: 56px; background: #25222e; border: 3px solid #120d1c"
      ></div>
      <div style="left: 30px; top: 262px; width: 40px; height: 18px; background: #3f8a62"></div>
      <div style="left: 74px; top: 248px; width: 16px; height: 10px; background: #f4efe6"></div>

        style="left: 150px; top: 300px; width: 100px; height: 60px; background: #9cc3e6; border: 3px solid #120d1c"
      ></div>
      <div style="left: 160px; top: 312px; width: 80px; height: 6px; background: #efe8ff"></div>
    </div>
  </body>
</html>
