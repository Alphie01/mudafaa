<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sahne · Sigorta eksperinin fotoğrafları</title>
<!--
  Dava #13: sigorta hasar dosyasındaki fotoğraf; aynı sunucu odası, başka bir açı ve tarih damgası. Dekoratif div'ler;
  dokunma alanları SceneDef nesneleridir: tarih damgası (240,20,90,30) · ziyaretçi defteri (40,240,90,60) ·
  sunucu rafı (150,100,100,160) · kahve bardağı (270,300,50,40). Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
<style>
body{margin:0;background:#141026}
#scene{position:relative;width:344px;height:380px;overflow:hidden;background:#141026;font-family:'Pixelify Sans',monospace;color:#efe8ff}
#scene div{position:absolute;box-sizing:border-box}
</style>
</head>
<body>
<div id="scene">
  <!-- fotoğraf çerçevesi -->
  <div style="left:6px;top:6px;width:332px;height:368px;background:#2b2350;border:4px solid #f4e7c5"></div>
  <div style="left:10px;top:270px;width:324px;height:100px;background:#3b3550;border-top:4px solid #120d1c"></div>
  <div style="left:10px;top:10px;width:324px;height:8px;background:#3a2f66"></div>
  <!-- tarih damgası -->
  <div style="left:242px;top:22px;width:86px;height:26px;color:#e2802f;font-size:11px;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px 0 #120d1c">18.10 11.20</div>
  <!-- sunucu rafı -->
  <div style="left:150px;top:100px;width:100px;height:166px;background:#1c1830;border:4px solid #120d1c"></div>
  <div style="left:160px;top:112px;width:80px;height:20px;background:#3a3550;border:2px solid #120d1c"></div>
  <div style="left:160px;top:140px;width:80px;height:20px;background:#3a3550;border:2px solid #120d1c"></div>
  <div style="left:160px;top:168px;width:80px;height:20px;background:#3a3550;border:2px solid #120d1c"></div>
  <div style="left:160px;top:196px;width:80px;height:20px;background:#3a3550;border:2px solid #120d1c"></div>
  <div style="left:160px;top:224px;width:80px;height:20px;background:#3a3550;border:2px solid #120d1c"></div>
  <div style="left:226px;top:118px;width:6px;height:6px;background:#52d273"></div>
  <div style="left:226px;top:146px;width:6px;height:6px;background:#52d273"></div>
  <div style="left:226px;top:174px;width:6px;height:6px;background:#e2802f"></div>
  <div style="left:226px;top:202px;width:6px;height:6px;background:#52d273"></div>
  <div style="left:226px;top:230px;width:6px;height:6px;background:#52d273"></div>
  <!-- kapı -->
  <div style="left:20px;top:60px;width:110px;height:210px;background:#4a4656;border:4px solid #120d1c"></div>
  <div style="left:110px;top:160px;width:10px;height:10px;border-radius:50%;background:#c9b26b;border:2px solid #120d1c"></div>
  <!-- raf üstü ziyaretçi defteri -->
  <div style="left:30px;top:228px;width:110px;height:8px;background:#8a5a3a;border:2px solid #120d1c"></div>
  <div style="left:42px;top:242px;width:86px;height:56px;background:#efe8ff;border:3px solid #120d1c"></div>
  <div style="left:84px;top:242px;width:3px;height:56px;background:#120d1c"></div>
  <div style="left:48px;top:252px;width:30px;height:2px;background:#6e6394"></div>
  <div style="left:48px;top:262px;width:30px;height:2px;background:#6e6394"></div>
  <div style="left:92px;top:252px;width:30px;height:2px;background:#6e6394"></div>
  <div style="left:92px;top:262px;width:22px;height:2px;background:#2f6fb0"></div>
  <div style="left:92px;top:272px;width:26px;height:2px;background:#6e6394"></div>
  <!-- kahve bardağı -->
  <div style="left:276px;top:304px;width:32px;height:34px;background:#efe8ff;border:3px solid #120d1c;border-radius:0 0 6px 6px"></div>
  <div style="left:272px;top:298px;width:40px;height:8px;background:#5a3a26;border:2px solid #120d1c"></div>
  <div style="left:284px;top:316px;width:16px;height:10px;border-radius:50%;background:#52d273;border:2px solid #120d1c"></div>
  <!-- zemin kabloları -->
  <div style="left:150px;top:290px;width:110px;height:3px;background:#2f6fb0"></div>
  <div style="left:140px;top:300px;width:90px;height:3px;background:#c0392b"></div>
</div>
</body>
</html>
