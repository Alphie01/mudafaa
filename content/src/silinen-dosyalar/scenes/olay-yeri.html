<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · TODO olay yeri</title>
    <!--
  Statik, betiksiz sahne. #scene sahnenin kendisidir: 344 × 300 sahne birimi (SceneDef width × height ile aynı).
  Yalnızca dekoratif div'ler; dokunma alanları ve rozetler HTML'e değil SceneDef nesnelerine yazılır.
  Renkler tasarımın paletinden: zemin #141026, duvar #2b2350, kenar #120d1c, metin #efe8ff.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div style="left: 0; right: 0; top: 40px; height: 180px; background: #2b2350"></div>
      <div style="left: 0; right: 0; top: 220px; bottom: 0; background: #3b3550; border-top: 4px solid #120d1c"></div>
      <div
        style="left: 40px; top: 150px; width: 60px; height: 50px; background: #4a3f7a; border: 3px solid #120d1c"
      ></div>
      <div
        style="left: 230px; top: 60px; width: 60px; height: 60px; background: #6e6394; border: 3px solid #120d1c"
      ></div>
    </div>
  </body>
</html>
