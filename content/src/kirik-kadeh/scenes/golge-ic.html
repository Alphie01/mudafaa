<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Gölge bar içi</title>
    <!--
  Statik, betiksiz sahne: 344 × 300 sahne birimi (SceneDef sc_bar). Dokunma alanları SceneDef nesnelerindedir.
  Soldan sağa: kolon (masa 4 önü), ayna, boks fotoğrafı, tezgâh, adisyon çivisi, mutfak kapısı ve askıdaki önlük;
  tezgâhın altında kayıt cihazı ve priz.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- duvar ve zemin -->
      <div style="left: 0; right: 0; top: 0; height: 200px; background: #2b2350"></div>
      <div style="left: 0; right: 0; top: 0; height: 26px; background: #1d1838"></div>
      <div style="left: 0; right: 0; top: 200px; bottom: 0; background: #3a2a24; border-top: 4px solid #120d1c"></div>
      <div style="left: 0; right: 0; top: 260px; height: 2px; background: #2a1d18"></div>
      <!-- sarı lamba ışığı -->
      <div style="left: 150px; top: 0; width: 60px; height: 8px; background: #e6c46a"></div>
      <div
        style="
          left: 120px;
          top: 8px;
          width: 120px;
          height: 120px;
          background: #e6c46a;
          opacity: 0.08;
          border-radius: 60px;
        "
      ></div>
      <!-- kolon -->
      <div
        style="left: 64px; top: 26px; width: 36px; height: 214px; background: #5c5a66; border: 3px solid #120d1c"
      ></div>
      <div style="left: 70px; top: 30px; width: 6px; height: 206px; background: #7d8590"></div>
      <!-- masa 4 -->
      <div
        style="left: 8px; top: 196px; width: 50px; height: 8px; background: #7a4a2a; border: 2px solid #120d1c"
      ></div>
      <div style="left: 30px; top: 206px; width: 6px; height: 34px; background: #3b2f2a"></div>
      <!-- ayna -->
      <div
        style="
          left: 116px;
          top: 48px;
          width: 62px;
          height: 30px;
          background: #9cc3e6;
          opacity: 0.55;
          border: 3px solid #7a4a2a;
        "
      ></div>
      <div
        style="left: 140px; top: 50px; width: 2px; height: 26px; background: #f4efe6; transform: rotate(25deg)"
      ></div>
      <!-- boks fotoğrafı -->
      <div
        style="left: 196px; top: 36px; width: 46px; height: 44px; background: #cfc9c1; border: 3px solid #120d1c"
      ></div>
      <div style="left: 210px; top: 44px; width: 16px; height: 28px; background: #4a4656"></div>
      <div style="left: 204px; top: 56px; width: 8px; height: 8px; background: #c4413a"></div>
      <div style="left: 226px; top: 56px; width: 8px; height: 8px; background: #c4413a"></div>
      <!-- raflar ve şişeler -->
      <div style="left: 110px; top: 96px; width: 150px; height: 4px; background: #120d1c"></div>
      <div style="left: 118px; top: 80px; width: 6px; height: 16px; background: #6a8a3e"></div>
      <div style="left: 132px; top: 76px; width: 6px; height: 20px; background: #f4efe6"></div>
      <div style="left: 146px; top: 80px; width: 6px; height: 16px; background: #a8521b"></div>
      <div style="left: 246px; top: 78px; width: 6px; height: 18px; background: #6a8a3e"></div>
      <!-- tezgâh -->
      <div
        style="left: 106px; top: 150px; width: 186px; height: 14px; background: #7a4a2a; border: 3px solid #120d1c"
      ></div>
      <div
        style="left: 110px; top: 167px; width: 178px; height: 86px; background: #3b2f2a; border: 3px solid #120d1c"
      ></div>
      <div style="left: 110px; top: 240px; width: 178px; height: 4px; background: #e6c46a"></div>
      <!-- kayıt cihazı ve priz -->
      <div
        style="left: 122px; top: 220px; width: 22px; height: 12px; background: #25222e; border: 2px solid #120d1c"
      ></div>
      <div
        style="left: 148px; top: 234px; width: 26px; height: 18px; background: #cfc9c1; border: 2px solid #120d1c"
      ></div>
      <div style="left: 158px; top: 238px; width: 6px; height: 6px; background: #c4413a"></div>
      <!-- adisyon çivisi -->
      <div style="left: 268px; top: 146px; width: 4px; height: 6px; background: #b08463"></div>
      <div
        style="left: 260px; top: 152px; width: 22px; height: 26px; background: #f4efe6; border: 2px solid #120d1c"
      ></div>
      <div style="left: 264px; top: 158px; width: 14px; height: 2px; background: #5c5a66"></div>
      <div style="left: 264px; top: 164px; width: 10px; height: 2px; background: #5c5a66"></div>
      <!-- mutfak kapısı ve önlük -->
      <div
        style="left: 300px; top: 30px; width: 44px; height: 170px; background: #1d1838; border-left: 3px solid #120d1c"
      ></div>
      <div style="left: 296px; top: 62px; width: 6px; height: 6px; background: #b08463"></div>
      <div
        style="left: 298px; top: 68px; width: 30px; height: 64px; background: #25222e; border: 2px solid #120d1c"
      ></div>
      <div style="left: 306px; top: 80px; width: 14px; height: 8px; background: #f4efe6"></div>
      <!-- devrik tabure -->
      <div
        style="left: 30px; top: 252px; width: 30px; height: 6px; background: #b08463; transform: rotate(-20deg)"
      ></div>
    </div>
  </body>
</html>
