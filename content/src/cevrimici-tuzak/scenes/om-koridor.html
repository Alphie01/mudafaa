<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · OM İş Merkezi, 4. kat koridoru</title>
    <!--
  Dava #02: iş merkezinin dördüncü kat koridoru. 344 × 300 sahne birimi. Dokunma alanları SceneDef nesneleridir:
  kat panosu (26,60,62,70) · 407 kapısı etiketi (140,70,54,22) · asansör (268,56,64,144) ·
  yangın tüpü (104,150,20,40) · saksı (210,160,36,40).
  Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div style="left: 0; right: 0; top: 0; height: 18px; background: #120d1c"></div>
      <div style="left: 40px; top: 4px; width: 60px; height: 6px; background: #efe8ff"></div>
      <div style="left: 200px; top: 4px; width: 60px; height: 6px; background: #4a4656"></div>
      <div style="left: 0; right: 0; top: 18px; height: 192px; background: #2b2350"></div>
      <div style="left: 0; right: 0; top: 210px; bottom: 0; background: #4a4656; border-top: 4px solid #120d1c"></div>
      <div style="left: 0; right: 0; top: 250px; height: 4px; background: #3b3550"></div>
      <!-- kat panosu -->
      <div
        style="left: 26px; top: 60px; width: 62px; height: 70px; background: #efe8ff; border: 3px solid #120d1c"
      ></div>
      <div style="left: 32px; top: 66px; width: 50px; height: 4px; background: #2c3e66"></div>
      <div style="left: 32px; top: 76px; width: 40px; height: 3px; background: #4a4656"></div>
      <div style="left: 32px; top: 84px; width: 44px; height: 3px; background: #4a4656"></div>
      <div style="left: 32px; top: 92px; width: 36px; height: 3px; background: #4a4656"></div>
      <div style="left: 32px; top: 100px; width: 42px; height: 3px; background: #4a4656"></div>
      <div style="left: 32px; top: 108px; width: 10px; height: 3px; background: #4a4656"></div>
      <!-- 407 kapısı -->
      <div
        style="left: 130px; top: 56px; width: 74px; height: 154px; background: #6e4a32; border: 4px solid #120d1c"
      ></div>
      <div
        style="left: 140px; top: 70px; width: 54px; height: 22px; background: #c9b26b; border: 2px solid #120d1c"
      ></div>
      <div
        style="
          left: 142px;
          top: 72px;
          width: 46px;
          height: 16px;
          background: #efe8ff;
          font-size: 5px;
          color: #2c3e66;
          padding: 2px;
        "
      >
        NOVA DİJİTAL
      </div>
      <div style="left: 186px; top: 130px; width: 8px; height: 8px; background: #c9b26b"></div>
      <!-- yangın tüpü -->
      <div
        style="left: 104px; top: 150px; width: 20px; height: 40px; background: #c4413a; border: 3px solid #120d1c"
      ></div>
      <!-- saksı -->
      <div
        style="left: 214px; top: 176px; width: 28px; height: 24px; background: #8a5c3e; border: 3px solid #120d1c"
      ></div>
      <div style="left: 210px; top: 156px; width: 36px; height: 22px; background: #3f8a62"></div>
      <!-- asansör -->
      <div
        style="left: 268px; top: 56px; width: 64px; height: 144px; background: #9aa1ab; border: 4px solid #120d1c"
      ></div>
      <div style="left: 298px; top: 60px; width: 4px; height: 136px; background: #120d1c"></div>
      <div
        style="
          left: 286px;
          top: 40px;
          width: 28px;
          height: 12px;
          background: #120d1c;
          font-size: 6px;
          color: #e8b13c;
          padding: 1px 6px;
        "
      >
        4
      </div>
    </div>
  </body>
</html>
