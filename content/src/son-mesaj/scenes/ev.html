<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Tarık'ın çalışma odası</title>
    <!--
  Dava #06: Tarık'ın evindeki çalışma odası. 344 × 300 sahne birimi. Dokunma alanları:
  koli (28,190,96,62) · ev modemi (250,60,54,30) · tablet (150,172,64,40) · çizim (160,48,72,62).
  Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- duvar -->
      <div style="left: 0; right: 0; top: 0; height: 236px; background: #2b2350"></div>
      <div style="left: 0; right: 0; top: 0; height: 236px; background: repeating-linear-gradient(90deg, rgba(239,232,255,0.04) 0 2px, transparent 2px 18px)"></div>
      <!-- kitaplık -->
      <div style="left: 14px; top: 20px; width: 110px; height: 150px; background: #6e4a32; border: 4px solid #120d1c"></div>
      <div style="left: 18px; top: 66px; width: 102px; height: 4px; background: #120d1c"></div>
      <div style="left: 18px; top: 116px; width: 102px; height: 4px; background: #120d1c"></div>
      <div style="left: 22px; top: 30px; width: 10px; height: 36px; background: #2f5a96"></div>
      <div style="left: 34px; top: 34px; width: 8px; height: 32px; background: #c4413a"></div>
      <div style="left: 44px; top: 28px; width: 12px; height: 38px; background: #e8b13c"></div>
      <div style="left: 22px; top: 80px; width: 40px; height: 36px; background: #3f8a62"></div>
      <div style="left: 70px; top: 84px; width: 10px; height: 32px; background: #7a2f45"></div>
      <!-- çizim (çocuk resmi) -->
      <div style="left: 160px; top: 48px; width: 72px; height: 62px; background: #f4efe6; border: 3px solid #120d1c; transform: rotate(-3deg)"></div>
      <div style="left: 170px; top: 64px; width: 22px; height: 22px; border: 2px solid #c4413a; border-radius: 11px 11px 0 0"></div>
      <div style="left: 198px; top: 64px; width: 22px; height: 22px; border: 2px solid #c4413a; border-radius: 11px 11px 0 0"></div>
      <div style="left: 176px; top: 90px; width: 6px; height: 12px; background: #2f5a96"></div>
      <div style="left: 206px; top: 90px; width: 8px; height: 12px; background: #120d1c"></div>
      <!-- ev modemi -->
      <div style="left: 250px; top: 60px; width: 54px; height: 30px; background: #efe8ff; border: 3px solid #120d1c"></div>
      <div style="left: 258px; top: 70px; width: 5px; height: 5px; background: #3f8a62"></div>
      <div style="left: 268px; top: 70px; width: 5px; height: 5px; background: #3f8a62"></div>
      <!-- pencere -->
      <div style="left: 250px; top: 110px; width: 70px; height: 90px; background: #1d1733; border: 5px solid #120d1c"></div>
      <div style="left: 283px; top: 110px; width: 4px; height: 90px; background: #120d1c"></div>
      <!-- zemin -->
      <div style="left: 0; right: 0; top: 236px; bottom: 0; background: #5c4636; border-top: 4px solid #120d1c"></div>
      <!-- masa ve tablet -->
      <div style="left: 140px; top: 206px; width: 100px; height: 12px; background: #6e4a32; border: 3px solid #120d1c"></div>
      <div style="left: 150px; top: 176px; width: 64px; height: 32px; background: #25222e; border: 3px solid #120d1c"></div>
      <div style="left: 156px; top: 182px; width: 52px; height: 20px; background: #6a4a9c"></div>
      <div style="left: 150px; top: 218px; width: 6px; height: 30px; background: #120d1c"></div>
      <div style="left: 226px; top: 218px; width: 6px; height: 30px; background: #120d1c"></div>
      <!-- koli -->
      <div style="left: 28px; top: 196px; width: 96px; height: 56px; background: #b08463; border: 4px solid #120d1c"></div>
      <div style="left: 24px; top: 188px; width: 50px; height: 12px; background: #c9a07a; border: 3px solid #120d1c; transform: rotate(-12deg)"></div>
      <div style="left: 76px; top: 188px; width: 50px; height: 12px; background: #c9a07a; border: 3px solid #120d1c; transform: rotate(10deg)"></div>
      <div style="left: 44px; top: 214px; width: 60px; height: 14px; background: #f4efe6; font-size: 6px; color: #120d1c">GERİSİ SENDE</div>
    </div>
  </body>
</html>
