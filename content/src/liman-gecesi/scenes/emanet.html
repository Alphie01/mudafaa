<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Emanet fotoğrafları</title>
    <!--
  Statik, betiksiz sahne. #scene: 344 × 300 sahne birimi (SceneDef width × height ile aynı).
  Yalnızca dekoratif div'ler; dokunma alanları ve rozetler SceneDef nesnelerinde.
  Renkler tasarımın paletinden: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div style="left: 0px; top: 0px; width: 344px; height: 300px; background: #1b1636"></div>
      <div
        style="left: 20px; top: 20px; width: 304px; height: 250px; background: #e6e1d6; border: 4px solid #120d1c"
      ></div>
      <div
        style="left: 60px; top: 120px; width: 88px; height: 64px; background: #e6c46a; border: 3px solid #120d1c"
      ></div>
      <div
        style="
          left: 84px;
          top: 160px;
          width: 40px;
          height: 24px;
          background: #c9805e;
          border: 2px solid #120d1c;
          border-radius: 0 0 50% 50%;
        "
      ></div>
      <div
        style="
          left: 56px;
          top: 192px;
          width: 96px;
          height: 6px;
          background: repeating-linear-gradient(90deg, #120d1c 0 1px, transparent 1px 8px);
        "
      ></div>
      <div
        style="
          left: 200px;
          top: 80px;
          width: 100px;
          height: 120px;
          background: #1d3a66;
          border: 3px solid #120d1c;
          border-radius: 10px 10px 0 0;
        "
      ></div>
      <div style="left: 276px; top: 120px; width: 6px; height: 6px; background: #c0392b; border-radius: 50%"></div>
      <div style="left: 270px; top: 132px; width: 5px; height: 5px; background: #c0392b; border-radius: 50%"></div>
      <div style="left: 282px; top: 140px; width: 5px; height: 5px; background: #c0392b; border-radius: 50%"></div>
      <div
        style="left: 20px; top: 242px; width: 84px; height: 26px; background: #f4efe6; border: 2px solid #120d1c"
      ></div>
      <div
        style="
          left: 252px;
          top: 230px;
          width: 60px;
          height: 38px;
          background: #6a8a3e;
          border: 2px solid #120d1c;
          border-radius: 8px;
        "
      ></div>
    </div>
  </body>
</html>
