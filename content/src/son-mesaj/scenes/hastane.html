<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Acil servis</title>
    <!--
  Dava #06: Çekirge'deki devlet hastanesinin acil servisi. 344 × 300 sahne birimi. Dokunma alanları:
  şarj (28,150,96,40) · kamera (268,18,44,30) · onam panosu (150,86,64,74) · saat (160,18,40,40) ·
  otomat (250,120,72,120). Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- duvar: soluk yeşil, florasan -->
      <div style="left: 0; right: 0; top: 0; height: 230px; background: #3f5a52"></div>
      <div style="left: 0; right: 0; top: 120px; height: 4px; background: #2a3f3a"></div>
      <div style="left: 40px; top: 4px; width: 90px; height: 6px; background: #f4efe6; box-shadow: 0 0 12px #f4efe6"></div>
      <div style="left: 210px; top: 4px; width: 50px; height: 6px; background: #c9c3b8"></div>
      <!-- saat -->
      <div style="left: 160px; top: 18px; width: 40px; height: 40px; border-radius: 50%; background: #efe8ff; border: 3px solid #120d1c"></div>
      <div style="left: 179px; top: 24px; width: 2px; height: 16px; background: #120d1c"></div>
      <div style="left: 180px; top: 38px; width: 12px; height: 2px; background: #120d1c"></div>
      <!-- kamera -->
      <div style="left: 268px; top: 18px; width: 44px; height: 14px; background: #25222e; border: 2px solid #120d1c"></div>
      <div style="left: 296px; top: 30px; width: 16px; height: 16px; border-radius: 50%; background: #4a4656; border: 2px solid #120d1c"></div>
      <div style="left: 302px; top: 36px; width: 4px; height: 4px; background: #c4413a"></div>
      <!-- onam panosu -->
      <div style="left: 150px; top: 86px; width: 64px; height: 74px; background: #8a5c3e; border: 3px solid #120d1c"></div>
      <div style="left: 156px; top: 92px; width: 24px; height: 30px; background: #f4efe6"></div>
      <div style="left: 184px; top: 92px; width: 24px; height: 30px; background: #f4efe6"></div>
      <div style="left: 156px; top: 126px; width: 24px; height: 28px; background: #f4efe6"></div>
      <div style="left: 184px; top: 126px; width: 24px; height: 28px; background: #e6c46a"></div>
      <!-- otomat -->
      <div style="left: 250px; top: 120px; width: 72px; height: 120px; background: #c4413a; border: 4px solid #120d1c"></div>
      <div style="left: 258px; top: 130px; width: 40px; height: 70px; background: #1d1733; border: 2px solid #120d1c"></div>
      <div style="left: 304px; top: 134px; width: 10px; height: 6px; background: #efe8ff"></div>
      <div style="left: 304px; top: 146px; width: 10px; height: 6px; background: #efe8ff"></div>
      <!-- zemin -->
      <div style="left: 0; right: 0; top: 230px; bottom: 0; background: #7d8590; border-top: 4px solid #120d1c"></div>
      <div style="left: 0; right: 0; top: 260px; height: 2px; background: #5c5a66"></div>
      <!-- hemşire masası ve şarj istasyonu -->
      <div style="left: 10px; top: 186px; width: 130px; height: 50px; background: #efe8ff; border: 4px solid #120d1c"></div>
      <div style="left: 28px; top: 156px; width: 96px; height: 30px; background: #25222e; border: 3px solid #120d1c"></div>
      <div style="left: 34px; top: 150px; width: 10px; height: 18px; background: #4a4656; border: 2px solid #120d1c"></div>
      <div style="left: 52px; top: 150px; width: 10px; height: 18px; background: #4a4656; border: 2px solid #120d1c"></div>
      <div style="left: 70px; top: 150px; width: 10px; height: 18px; background: #4a4656; border: 2px solid #120d1c"></div>
      <div style="left: 88px; top: 150px; width: 10px; height: 18px; background: #4a4656; border: 2px solid #120d1c"></div>
      <div style="left: 34px; top: 172px; width: 82px; height: 6px; background: #e6c46a"></div>
      <!-- bekleme sandalyeleri -->
      <div style="left: 150px; top: 200px; width: 90px; height: 12px; background: #2f5a96; border: 3px solid #120d1c"></div>
      <div style="left: 160px; top: 212px; width: 6px; height: 24px; background: #120d1c"></div>
      <div style="left: 224px; top: 212px; width: 6px; height: 24px; background: #120d1c"></div>
    </div>
  </body>
</html>
