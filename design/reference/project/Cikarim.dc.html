<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Müdafaa — Çıkarım Tahtası</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#e8b13c}a:hover{color:#ffd36b}
.pxbtn{box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.22), 4px 4px 0 #120d1c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1d1733; font-family: 'VT323', monospace; color: #efe8ff; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px">
    <a href="Inceleme.dc.html" aria-label="İncelemeye dön" class="pxbtn" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #3a2f66; border: 3px solid #120d1c; color: #efe8ff; box-sizing: border-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 12px; color: #b3a8d6; letter-spacing: 2px">ADIM 3 · BİRLEŞTİR</span>
      <h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 700; color: #e8b13c">Çıkarım Tahtası</h1>
    </div>
    <span style="font-family: 'Pixelify Sans', monospace; font-size: 13px; color: #e8b13c">DELİL {{solvedCount}}/3</span>
  </header>

  <p style="margin: 0 20px 10px; font-size: 19px; color: #b3a8d6; line-height: 1.05">İki ipucunu seç. Birbirini tamamlıyorsa duruşmada kullanabileceğin bir DELİL doğar.</p>

  <section aria-label="Birleştirme" style="margin: 0 20px; display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 6px">
    <div style="min-height: 64px; padding: 6px 8px; box-sizing: border-box; background: {{slotA.bg}}; border: 3px {{slotA.border}} #120d1c; color: #120d1c; font-size: 18px; line-height: 1; display: flex; align-items: center">{{slotA.text}}</div>
    <span aria-hidden="true" style="font-family: 'Pixelify Sans', monospace; font-size: 24px; font-weight: 700; text-align: center; color: #e8b13c">+</span>
    <div style="min-height: 64px; padding: 6px 8px; box-sizing: border-box; background: {{slotB.bg}}; border: 3px {{slotB.border}} #120d1c; color: #120d1c; font-size: 18px; line-height: 1; display: flex; align-items: center">{{slotB.text}}</div>
  </section>

  <section role="status" aria-label="Sonuç" style="margin: 10px 20px 0; padding: 10px 12px; background: {{res.bg}}; color: #120d1c; border: 3px solid #120d1c; box-shadow: 4px 4px 0 #120d1c; min-height: 104px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'Pixelify Sans', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px">{{res.tag}}</span>
    <span style="font-family: 'Pixelify Sans', monospace; font-size: 17px; font-weight: 700">{{res.title}}</span>
    <span style="font-size: 18px; line-height: 1.05">{{res.text}}</span>
  </section>

  <section aria-label="İpuçları panosu" style="margin: 14px 20px 0; padding: 12px; background: #6b4630; border: 3px solid #120d1c; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">
        <span style="font-family: 'Pixelify Sans', monospace; font-size: 10px; color: #5b4a2a">{{c.src}}</span>
        <span>{{c.text}}</span>
      </button>
    </sc-for>
  </section>

  <section aria-label="Çıkarılan deliller" style="margin: 12px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'Pixelify Sans', monospace; font-size: 12px; letter-spacing: 1px; color: #b3a8d6">ÇIKARILAN DELİLLER</span>
    <sc-for list="{{solved}}" as="s" hint-placeholder-count="1">
      <div style="display: flex; justify-content: space-between; font-size: 18px"><span style="color: #6fd08d">■ {{s.title}}</span><span style="color: #b3a8d6">{{s.hits}}</span></div>
    </sc-for>
  </section>

  <div style="margin-top: auto; padding: 12px 20px 26px">
    <a href="Durusma.dc.html" class="pxbtn" style="display: flex; justify-content: center; align-items: center; height: 58px; background: #d9503c; color: #ffffff; text-decoration: none; border: 3px solid #120d1c; font-family: 'Pixelify Sans', monospace; font-size: 18px; font-weight: 700">DURUŞMAYA HAZIRIM ›</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: 'ampul', b: 'ariza', solved: ['ampul+ariza'] };
  }
  pick(id) {
    const st = this.state;
    if (st.a === id) { this.setState({ a: null }); return; }
    if (st.b === id) { this.setState({ b: null }); return; }
    let a = st.a, b = st.b;
    if (!a) a = id; else if (!b) b = id; else { a = id; b = null; }
    let solved = st.solved;
    if (a && b) {
      const k = this.key(a, b);
      if (this.recipes()[k] && solved.indexOf(k) < 0) solved = solved.concat([k]);
    }
    this.setState({ a, b, solved });
  }
  key(a, b) { return [a, b].sort().join('+'); }
  recipes() {
    return {
      'ampul+ariza': { title: 'Lamba o gece yanmıyordu', text: 'Sokak karanlıktı. Tanığın “yüzünü net seçtim” sözü çürür.', hits: 'Çürütür: Tanık teşhisi' },
      'iz42+murat': { title: 'İz Murat Koç’a ait olabilir', text: 'Depo 3’ün çalışanı 42 numara giyiyor; Kerem 39. Yeni şüpheli!', hits: 'Yeni şüpheli' },
      'fis+huseyin': { title: 'Kerem’in mazereti doğrulandı', text: 'Fiş 22.57, Hüseyin 23.15’e kadar birlikteydiklerini söylüyor.', hits: 'Mazeret' }
    };
  }
  renderVals() {
    const st = this.state;
    const C = [
      { id: 'ampul', src: 'OLAY YERİ', text: 'Lamba ampulü kararmış' },
      { id: 'ariza', src: 'ARŞİV', text: 'Belediye arıza kaydı: 14 no’lu direk' },
      { id: 'iz42', src: 'OLAY YERİ', text: 'Çamurda 42 numara bot izi' },
      { id: 'murat', src: 'İNCELEME', text: 'Murat Koç: Depo 3, numara 42' },
      { id: 'fis', src: 'MÜVEKKİL', text: 'Çay ocağı fişi, saat 22.57' },
      { id: 'huseyin', src: 'TANIK', text: 'Hüseyin: “23.15’e kadar yanımdaydı”' }
    ];
    const byId = {};
    C.forEach((c) => { byId[c.id] = c; });
    const base = "display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 64px; padding: 6px 8px; text-align: left; border: 3px solid #120d1c; font-family: 'VT323', monospace; font-size: 18px; line-height: 1; color: #120d1c; cursor: pointer;";
    const cards = C.map((c) => {
      const on = st.a === c.id || st.b === c.id;
      return {
        ...c,
        on: on ? 'true' : 'false',
        style: base + (on ? ' background: #e8b13c; box-shadow: 0 0 0 3px #f4e7c5;' : ' background: #f4e7c5; box-shadow: 3px 3px 0 #120d1c;'),
        pick: () => this.pick(c.id)
      };
    });
    const slot = (id) => id
      ? { text: byId[id].text, bg: '#f4e7c5', border: 'solid' }
      : { text: 'İpucu seç', bg: '#2b2350', border: 'dashed' };
    const R = this.recipes();
    let res;
    if (st.a && st.b) {
      const r = R[this.key(st.a, st.b)];
      res = r
        ? { tag: 'YENİ DELİL · +300 SKOR', title: r.title, text: r.text, bg: '#bfe6c9' }
        : { tag: 'BAĞLANTI YOK · −50 SKOR', title: 'Bu ikisi birbirini açıklamıyor', text: 'Başka bir ipucu dene.', bg: '#ef9a8a' };
    } else {
      res = { tag: 'BEKLENİYOR', title: 'İki ipucu seç', text: 'Gizli kombinasyon: 3', bg: '#d9c597' };
    }
    const solved = st.solved.map((k) => ({ title: R[k].title, hits: R[k].hits }));
    return { cards, slotA: slot(st.a), slotB: slot(st.b), res, solved, solvedCount: solved.length };
  }
}
</script>
</body>
</html>
