<!doctype html>

    <title>Sahne · Yalçınların evi · Emir’in odası</title>
    <!--
  Dava #15: Yalçınların evi · Emir’in odası. Dokunma alanları SceneDef nesneleridir: bileği taşı (40,240,70,40) · sefer saatleri (200,40,70,90) · bıçak seti (140,230,80,40) · eldivenler (290,150,40,70) · diploma (40,50,80,60).

-->

        background: #141026;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
    </style>
  </head>
