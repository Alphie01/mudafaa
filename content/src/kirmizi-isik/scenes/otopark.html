<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Yediemin otoparkı, beyaz sedan</title>
    <!-- Statik, betiksiz sahne: 344 × 300 sahne birimi. Dokunma alanları SceneDef nesnelerindedir. -->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #4a4656;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- tel örgü ve gök -->
      <div style="left: 0; top: 0; width: 344px; height: 120px; background: #5c5a66"></div>
      <div style="left: 0; top: 30px; width: 344px; height: 2px; background: #7d8590"></div>
      <div style="left: 0; top: 60px; width: 344px; height: 2px; background: #7d8590"></div>
      <div style="left: 40px; top: 0; width: 2px; height: 120px; background: #7d8590"></div>
      <div style="left: 140px; top: 0; width: 2px; height: 120px; background: #7d8590"></div>
      <div style="left: 240px; top: 0; width: 2px; height: 120px; background: #7d8590"></div>
      <!-- zemin -->
      <div style="left: 0; top: 230px; width: 344px; height: 70px; background: #3b2f2a"></div>
      <!-- araç gövdesi -->
      <div
        style="left: 30px; top: 140px; width: 290px; height: 80px; background: #f4efe6; border: 3px solid #120d1c"
      ></div>
      <div
        style="left: 110px; top: 90px; width: 190px; height: 54px; background: #cfc9c1; border: 3px solid #120d1c"
      ></div>
      <!-- iç: gösterge ve ekran (camdan görünüm) -->
      <div style="left: 190px; top: 92px; width: 106px; height: 40px; background: #25222e"></div>
      <div style="left: 198px; top: 100px; width: 26px; height: 14px; background: #e8b13c"></div>
      <div
        style="left: 242px; top: 98px; width: 42px; height: 26px; background: #2f5a96; border: 2px solid #120d1c"
      ></div>
      <!-- arka koltuk: bebek koltuğu -->
      <div
        style="left: 252px; top: 152px; width: 46px; height: 42px; background: #7b4fb0; border: 2px solid #120d1c"
      ></div>
      <!-- önlük -->
      <div
        style="left: 152px; top: 152px; width: 46px; height: 26px; background: #2c3e66; border: 2px solid #120d1c"
      ></div>
      <!-- far ve tampon -->
      <div
        style="left: 38px; top: 178px; width: 42px; height: 18px; background: #e6c46a; border: 2px solid #120d1c"
      ></div>
      <div
        style="left: 30px; top: 214px; width: 96px; height: 18px; background: #cfc9c1; border: 3px solid #120d1c"
      ></div>
      <div style="left: 46px; top: 222px; width: 60px; height: 3px; background: #5c5a66"></div>
      <!-- tekerlekler -->
      <div style="left: 60px; top: 210px; width: 44px; height: 44px; background: #120d1c"></div>
      <div style="left: 240px; top: 210px; width: 44px; height: 44px; background: #120d1c"></div>
    </div>
  </body>
</html>
