<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Sırmakeş merdivenleri</title>
    <!--
  Dava #05: Sırmakeş merdivenleri, 19 Ocak 01.10 olay yeri fotoğrafı (flaşlı, yağmurlu gece).
  Dokunma alanları SceneDef nesneleridir: şişe (150,210,50,36) · askı (84,150,44,30) · motor lekesi (240,320,80,44) ·
  eczane (250,60,70,60) · kedi (20,300,40,30). Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 380px;
        overflow: hidden;
        background: #100c1e;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- gökyüzü ve yağmur -->
      <div style="left: 0; right: 0; top: 0; height: 120px; background: #1a1430"></div>
      <div
        style="
          left: 0;
          right: 0;
          top: 0;
          height: 380px;
          background: repeating-linear-gradient(100deg, rgba(156, 195, 230, 0.08) 0 1px, transparent 1px 14px);
        "
      ></div>
      <!-- sol duvar ve evler -->
      <div
        style="left: 0; top: 40px; width: 70px; height: 260px; background: #2b2350; border-right: 4px solid #120d1c"
      ></div>
      <div
        style="left: 12px; top: 70px; width: 22px; height: 30px; background: #f4d36b; border: 3px solid #120d1c"
      ></div>
      <div
        style="left: 12px; top: 140px; width: 22px; height: 30px; background: #1d1733; border: 3px solid #120d1c"
      ></div>
      <!-- eczane (sağ üst) -->
      <div
        style="left: 236px; top: 40px; width: 108px; height: 110px; background: #2b2350; border: 4px solid #120d1c"
      ></div>
      <div
        style="
          left: 250px;
          top: 62px;
          width: 70px;
          height: 22px;
          background: #3f8a62;
          border: 3px solid #120d1c;
          font-size: 9px;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        ECZANE
      </div>
      <div
        style="
          left: 296px;
          top: 92px;
          width: 16px;
          height: 14px;
          border-radius: 0 0 8px 8px;
          background: #4a4656;
          border: 2px solid #120d1c;
        "
      ></div>
      <div style="left: 302px; top: 100px; width: 4px; height: 4px; background: #5c5a66"></div>
      <!-- merdiven: sol üstten sağ alta -->
      <div
        style="
          left: 70px;
          top: 120px;
          width: 200px;
          height: 20px;
          background: #5c5a66;
          border-bottom: 4px solid #120d1c;

      <div
        style="
