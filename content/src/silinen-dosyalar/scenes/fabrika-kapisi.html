<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sahne · Nilüfer Örme fabrika kapısı (gece)</title>
<!--
  Dava #13: organize sanayide fabrikanın ana kapısı, dışarıdan, yağmurlu gece. Dekoratif div'ler; dokunma alanları
  SceneDef nesneleridir: kapı defteri (40,220,80,40) · turnike (210,180,50,110) · park yeri (270,300,70,50) ·
  servis tabelası (150,40,80,50). Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
<style>
body{margin:0;background:#141026}
#scene{position:relative;width:344px;height:380px;overflow:hidden;background:#141026;font-family:'Pixelify Sans',monospace;color:#efe8ff}
#scene div{position:absolute;box-sizing:border-box}
</style>
</head>
<body>
<div id="scene">
  <!-- gece gökyüzü, fabrika silueti -->
  <div style="left:0;right:0;top:0;height:200px;background:#141026"></div>
  <div style="left:0;top:110px;width:344px;height:90px;background:#221c3c"></div>
  <div style="left:250px;top:60px;width:18px;height:60px;background:#221c3c"></div>

  <div style="left:300px;top:130px;width:12px;height:8px;background:#f2c94c"></div>
  <div style="left:0;right:0;top:0;height:300px;background:repeating-linear-gradient(100deg,transparent 0 13px,#3a2f66 13px 14px);opacity:.55"></div>

  <div style="left:186px;top:90px;width:6px;height:110px;background:#8a8a96"></div>

</div>

</html>
