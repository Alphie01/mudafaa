<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Aksoy Mimarlık ofisi</title>
    <!--
  Dava #06: Eski Pirinç Han'ın üst katı. 344 × 300 sahne birimi. Dokunma alanları SceneDef nesneleridir:
  dok (36,150,76,40) · klavye (122,196,56,22) · klasör (252,64,62,84) · fotoğraf (150,56,62,46) ·
  plan (196,176,96,50) · modem (20,62,44,28). Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
        font-family: 'Pixelify Sans', monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- taş duvar ve kemerler -->
      <div style="left: 0; right: 0; top: 0; height: 236px; background: #3a3348"></div>
      <div style="left: 0; right: 0; top: 0; height: 236px; background: repeating-linear-gradient(0deg, rgba(18,13,28,0.25) 0 2px, transparent 2px 22px)"></div>
      <div style="left: 70px; top: 6px; width: 120px; height: 120px; border-radius: 60px 60px 0 0; border: 6px solid #2b2350; border-bottom: none"></div>
      <div style="left: 200px; top: 6px; width: 120px; height: 120px; border-radius: 60px 60px 0 0; border: 6px solid #2b2350; border-bottom: none"></div>
      <!-- pencere: dışarıda yağmur -->
      <div style="left: 92px; top: 26px; width: 48px; height: 58px; background: #1d1733; border: 4px solid #120d1c"></div>
      <div style="left: 100px; top: 32px; width: 2px; height: 46px; background: #6e6394"></div>
      <div style="left: 118px; top: 30px; width: 2px; height: 40px; background: #6e6394"></div>
      <!-- modem -->
      <div style="left: 20px; top: 62px; width: 44px; height: 28px; background: #25222e; border: 3px solid #120d1c"></div>
      <div style="left: 28px; top: 70px; width: 5px; height: 5px; background: #3f8a62"></div>
      <div style="left: 38px; top: 70px; width: 5px; height: 5px; background: #3f8a62"></div>
      <div style="left: 48px; top: 70px; width: 5px; height: 5px; background: #e8b13c"></div>
      <!-- çerçeveli fotoğraf -->
      <div style="left: 150px; top: 56px; width: 62px; height: 46px; background: #8a5c3e; border: 3px solid #120d1c"></div>
      <div style="left: 157px; top: 62px; width: 48px; height: 34px; background: #c9b79a"></div>
      <div style="left: 166px; top: 72px; width: 10px; height: 20px; background: #4a4656"></div>
      <div style="left: 186px; top: 72px; width: 10px; height: 20px; background: #1d3a66"></div>
      <div style="left: 160px; top: 80px; width: 42px; height: 2px; background: #c4413a"></div>
      <!-- raf ve klasör -->
      <div style="left: 240px; top: 148px; width: 90px; height: 6px; background: #120d1c"></div>
      <div style="left: 252px; top: 64px; width: 30px; height: 84px; background: #2f5a96; border: 3px solid #120d1c"></div>
      <div style="left: 284px; top: 72px; width: 30px; height: 76px; background: #7a2f45; border: 3px solid #120d1c"></div>
      <div style="left: 256px; top: 92px; width: 22px; height: 10px; background: #efe8ff; font-size: 5px; color: #120d1c">YAZ.</div>
      <!-- zemin -->
      <div style="left: 0; right: 0; top: 236px; bottom: 0; background: #4a3a2e; border-top: 4px solid #120d1c"></div>
      <!-- sol masa: eski ortağın masası, boş dok -->
      <div style="left: 20px; top: 186px; width: 110px; height: 14px; background: #6e4a32; border: 3px solid #120d1c"></div>
      <div style="left: 30px; top: 200px; width: 8px; height: 40px; background: #120d1c"></div>
      <div style="left: 112px; top: 200px; width: 8px; height: 40px; background: #120d1c"></div>
      <div style="left: 40px; top: 166px; width: 66px; height: 20px; background: #25222e; border: 3px solid #120d1c"></div>
      <div style="left: 50px; top: 160px; width: 46px; height: 5px; background: #120d1c"></div>
      <div style="left: 44px; top: 148px; width: 56px; height: 12px; border: 1px dashed #8a8270"></div>
      <div style="left: 92px; top: 170px; width: 12px; height: 7px; background: #efe8ff; font-size: 5px; color: #120d1c">07</div>
      <div style="left: 104px; top: 178px; width: 36px; height: 2px; background: #120d1c"></div>
      <!-- klavye -->
      <div style="left: 122px; top: 196px; width: 56px; height: 22px; background: #5c5a66; border: 3px solid #120d1c"></div>
      <div style="left: 128px; top: 202px; width: 44px; height: 3px; background: #7d8590"></div>
      <div style="left: 128px; top: 208px; width: 44px; height: 3px; background: #7d8590"></div>
      <div style="left: 160px; top: 214px; width: 14px; height: 6px; background: #e8b13c"></div>
      <!-- çizim masası ve plan -->
      <div style="left: 190px; top: 170px; width: 108px; height: 60px; background: #efe8ff; border: 4px solid #120d1c; transform: skewX(-8deg)"></div>
      <div style="left: 204px; top: 182px; width: 40px; height: 30px; border: 2px solid #2f5a96; border-radius: 20px 20px 0 0"></div>
      <div style="left: 248px; top: 182px; width: 40px; height: 30px; border: 2px solid #2f5a96; border-radius: 20px 20px 0 0"></div>
      <div style="left: 236px; top: 230px; width: 8px; height: 40px; background: #120d1c"></div>
    </div>
  </body>
</html>
