<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Müdafaa — Olay Yeri Araması</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#e8b13c}a:hover{color:#ffd36b}
.pxbtn{box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.22), 4px 4px 0 #120d1c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1d1733; font-family: 'VT323', monospace; color: #efe8ff; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px">
    <a href="Gorusme.dc.html" aria-label="Görüşmeye dön" class="pxbtn" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #3a2f66; border: 3px solid #120d1c; color: #efe8ff; box-sizing: border-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 12px; color: #b3a8d6; letter-spacing: 2px">ADIM 1 · ARA</span>
      <h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 700; color: #e8b13c">Depo Sokağı, 23.00</h1>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end">
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 11px; color: #b3a8d6">BÜYÜTEÇ</span>
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 18px; font-weight: 700; color: {{tapColor}}">{{taps}} / 6</span>
    </div>
  </header>

  <p style="margin: 0 20px 10px; font-size: 19px; color: #b3a8d6; line-height: 1.05">Sahnede şüpheli gördüğün yere dokun. Boş yere dokunmak bir büyüteç hakkı yer.</p>

  <section aria-label="Olay yeri sahnesi" style="position: relative; margin: 0 20px; height: 380px; background: #141026; border: 3px solid #120d1c; overflow: hidden">
    <button type="button" aria-label="Boş alan" onClick="{{miss}}" style="position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; border: 0; cursor: crosshair"></button>

    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 0; right: 0; top: 56px; height: 230px; background: #2b2350"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 0; right: 0; top: 56px; height: 10px; background: #3a2f66"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 150px; top: 200px; width: 40px; height: 6px; background: #3a2f66"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 200px; top: 230px; width: 40px; height: 6px; background: #3a2f66"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 14px; top: 108px; width: 124px; height: 16px; background: #f4e7c5; border: 3px solid #120d1c; box-sizing: border-box; font-family: 'Pixelify Sans', monospace; font-size: 9px; color: #120d1c; display: flex; align-items: center; justify-content: center">DEPO 3</div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 20px; top: 128px; width: 112px; height: 158px; box-sizing: border-box; padding: 5px; background: #4a3f7a; border: 4px solid #120d1c; display: grid; grid-template-rows: repeat(8, minmax(0, 1fr)); gap: 3px">
      <div style="background: #3a2f66"></div><div style="background: #3a2f66"></div><div style="background: #3a2f66"></div><div style="background: #3a2f66"></div><div style="background: #3a2f66"></div><div style="background: #3a2f66"></div><div style="background: #3a2f66"></div><div style="background: #3a2f66"></div>
    </div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 156px; top: 84px; width: 34px; height: 18px; background: #6e6394; border: 3px solid #120d1c"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 150px; top: 90px; width: 8px; height: 8px; background: #120d1c"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 172px; top: 105px; width: 4px; height: 40px; background: #120d1c"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 172px; top: 158px; width: 4px; height: 128px; background: #120d1c"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 272px; top: 70px; width: 8px; height: 216px; background: #6e6394"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 254px; top: 58px; width: 44px; height: 14px; background: #6e6394; border: 3px solid #120d1c"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 264px; top: 75px; width: 24px; height: 8px; background: #3a3550"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 0; right: 0; top: 286px; bottom: 0; background: #3b3550; border-top: 4px solid #120d1c"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 194px; top: 312px; width: 12px; height: 20px; background: #1d1733"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 214px; top: 338px; width: 12px; height: 20px; background: #1d1733"></div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 300px; top: 246px; width: 36px; height: 44px; background: #4a4656; border: 3px solid #120d1c; border-top-width: 6px"></div>

    <button type="button" aria-label="Sokak lambası" onClick="{{h.lamba.pick}}" style="position: absolute; left: 244px; top: 44px; width: 64px; height: 52px; cursor: zoom-in; {{h.lamba.style}}"></button>
    <button type="button" aria-label="Güvenlik kamerası" onClick="{{h.kamera.pick}}" style="position: absolute; left: 144px; top: 76px; width: 56px; height: 90px; cursor: zoom-in; {{h.kamera.style}}"></button>
    <button type="button" aria-label="Yerdeki izler" onClick="{{h.iz.pick}}" style="position: absolute; left: 180px; top: 302px; width: 60px; height: 66px; cursor: zoom-in; {{h.iz.style}}"></button>
    <button type="button" aria-label="Çöp kutusu" onClick="{{h.cop.pick}}" style="position: absolute; left: 292px; top: 236px; width: 52px; height: 62px; cursor: zoom-in; {{h.cop.style}}"></button>

    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 40px; top: 300px; width: 70px; height: 70px; border-radius: 50%; border: 5px solid #f4e7c5; background: #3b3550; box-shadow: 4px 4px 0 #120d1c; display: flex; align-items: center; justify-content: center; font-family: 'Pixelify Sans', monospace; font-size: 18px; font-weight: 700; color: #efe8ff">42</div>
    <div aria-hidden="true" style="pointer-events: none; position: absolute; left: 104px; top: 362px; width: 26px; height: 8px; background: #f4e7c5; transform: rotate(45deg)"></div>
  </section>

  <div role="status" style="margin: 12px 20px 0; padding: 8px 12px; background: {{msgBg}}; color: #120d1c; border: 3px solid #120d1c; font-size: 19px; line-height: 1.05; min-height: 44px; box-sizing: border-box">{{msg}}</div>

  <section aria-label="Not defteri" style="margin: 12px 20px 0; padding: 10px 12px; background: #2b2350; border: 3px solid #120d1c; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; justify-content: space-between; font-family: 'Pixelify Sans', monospace; font-size: 12px; letter-spacing: 1px">
      <span style="color: #b3a8d6">NOT DEFTERİ · İPUÇLARI</span>
      <span style="color: #e8b13c">{{count}} / 4</span>
    </div>
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="2">
      <div style="font-size: 18px; line-height: 1.05">› {{n.short}}</div>
    </sc-for>
  </section>

  <div style="margin-top: auto; padding: 12px 20px 26px">
    <a href="Inceleme.dc.html" class="pxbtn" style="display: flex; justify-content: center; align-items: center; height: 58px; background: #e8b13c; color: #120d1c; text-decoration: none; border: 3px solid #120d1c; font-family: 'Pixelify Sans', monospace; font-size: 18px; font-weight: 700">DELİLLERİ İNCELE ›</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { found: { lamba: true, iz: true }, taps: 4, last: 'iz', missed: false };
  }
  renderVals() {
    const C = {
      lamba: { short: 'Lamba ampulü kararmış', text: 'Lamba ampulü kararmış, camı tozlu. Uzun süredir yanmıyor gibi.' },
      kamera: { short: 'Kamera kablosu kesilmiş', text: 'Kamera kablosu temiz bir kesikle kesilmiş. Bu bir kopma değil.' },
      iz: { short: 'Çamurda 42 numara bot izi', text: 'Çamurda 42 numara bot izi var, depodan sokağa doğru gidiyor.' },
      cop: { short: 'Çöpte taze izmarit', text: 'Çöp kutusunda taze bir izmarit. Kerem sigara içmiyor.' }
    };
    const st = this.state;
    const h = {};
    Object.keys(C).forEach((k) => {
      const on = !!st.found[k];
      h[k] = {
        style: on ? 'background: rgba(232,177,60,.18); border: 3px solid #e8b13c;' : 'background: transparent; border: 0;',
        pick: () => {
          if (st.found[k] || st.taps <= 0) { this.setState({ last: k, missed: false }); return; }
          this.setState({ found: { ...st.found, [k]: true }, taps: st.taps - 1, last: k, missed: false });
        }
      };
    });
    const notes = Object.keys(C).filter((k) => st.found[k]).map((k) => ({ short: C[k].short }));
    let msg = 'Sahnede şüpheli bir yere dokun.';
    let msgBg = '#d9c597';
    if (st.missed) { msg = 'Burada dikkat çeken bir şey yok. (−1 büyüteç)'; msgBg = '#ef9a8a'; }
    else if (st.last && C[st.last]) { msg = 'İPUCU: ' + C[st.last].text; msgBg = '#f4e7c5'; }
    if (st.taps <= 0) { msg = 'Büyüteç hakkın bitti. Bulduklarınla devam et.'; msgBg = '#ef9a8a'; }
    return {
      h, notes, msg, msgBg,
      count: notes.length,
      taps: st.taps,
      tapColor: st.taps <= 1 ? '#ef7a66' : '#e8b13c',
      miss: () => { if (st.taps > 0) this.setState({ taps: st.taps - 1, missed: true }); }
    };
  }
}
</script>
</body>
</html>
