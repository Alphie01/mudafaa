<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Ön oda ve koridor (olay yeri fotoğrafı)</title>
    <!--
  Statik, betiksiz sahne: 344 × 300 sahne birimi (SceneDef sc_on). Sol: ön oda; sağ: giriş ve koridor.
-->
    <style>
      body { margin: 0; background: #141026; }
      #scene { position: relative; width: 344px; height: 300px; overflow: hidden; background: #141026; }
      #scene div { position: absolute; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- ön oda duvarı -->
      <div style="left: 0; top: 0; width: 232px; height: 196px; background: #2b2350"></div>
      <div style="left: 0; top: 196px; width: 232px; height: 104px; background: #3a2f4a; border-top: 4px solid #120d1c"></div>
      <!-- koridor -->
      <div style="left: 232px; top: 0; width: 112px; height: 220px; background: #352c55; border-left: 4px solid #120d1c"></div>
      <div style="left: 232px; top: 220px; width: 112px; height: 80px; background: #2e2540; border-top: 4px solid #120d1c"></div>
      <!-- balkon kapısı -->
      <div style="left: 20px; top: 20px; width: 60px; height: 150px; background: #1b2440; border: 3px solid #120d1c"></div>
      <div style="left: 48px; top: 24px; width: 3px; height: 142px; background: #120d1c"></div>
      <!-- gitar -->
      <div style="left: 108px; top: 56px; width: 12px; height: 60px; background: #7a4a2a; border: 2px solid #120d1c"></div>
      <div style="left: 100px; top: 112px; width: 28px; height: 52px; background: #a8521b; border: 3px solid #120d1c; border-radius: 12px"></div>
      <!-- masa, kitaplar, kül tablası, kart -->
      <div style="left: 144px; top: 150px; width: 80px; height: 10px; background: #5a4632; border: 2px solid #120d1c"></div>
      <div style="left: 150px; top: 160px; width: 6px; height: 36px; background: #5a4632"></div>
      <div style="left: 212px; top: 160px; width: 6px; height: 36px; background: #5a4632"></div>
      <div style="left: 150px; top: 160px; width: 22px; height: 6px; background: #7d8590; border: 2px solid #120d1c; border-radius: 4px"></div>
      <div style="left: 176px; top: 136px; width: 28px; height: 14px; background: #f4efe6; border: 1px solid #120d1c"></div>
      <div style="left: 180px; top: 140px; width: 16px; height: 2px; background: #c4413a"></div>
      <div style="left: 206px; top: 130px; width: 14px; height: 20px; background: #2f5a96; border: 1px solid #120d1c"></div>
      <!-- yatak -->
      <div style="left: 16px; top: 200px; width: 124px; height: 56px; background: #2c3e66; border: 3px solid #120d1c"></div>
      <div style="left: 22px; top: 204px; width: 30px; height: 18px; background: #cfc9c1"></div>
      <div style="left: 70px; top: 214px; width: 40px; height: 22px; background: #f4efe6; border: 2px solid #120d1c"></div>
      <div style="left: 60px; top: 230px; width: 26px; height: 6px; background: #120d1c; border-radius: 6px"></div>
      <!-- koridor rafı ve şekerlik -->
      <div style="left: 252px; top: 138px; width: 56px; height: 6px; background: #5a4632; border: 2px solid #120d1c"></div>
      <div style="left: 266px; top: 108px; width: 26px; height: 30px; background: #9cc3e6; border: 3px solid #120d1c; border-radius: 4px"></div>
      <div style="left: 268px; top: 104px; width: 22px; height: 6px; background: #c4413a"></div>
      <!-- arka oda kapısı (kenarda) -->
      <div style="left: 316px; top: 40px; width: 28px; height: 180px; background: #5a4632; border-left: 3px solid #120d1c"></div>
      <!-- ayakkabılık -->
      <div style="left: 246px; top: 236px; width: 84px; height: 44px; background: #4a3a2a; border: 3px solid #120d1c"></div>
      <div style="left: 254px; top: 244px; width: 26px; height: 12px; background: #f4efe6; border: 1px solid #120d1c"></div>
      <div style="left: 288px; top: 240px; width: 36px; height: 16px; background: #3b2f2a; border: 1px solid #120d1c"></div>
      <div style="left: 290px; top: 256px; width: 30px; height: 4px; background: #7a4a2a"></div>
    </div>
  </body>
</html>
