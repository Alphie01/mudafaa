<!doctype html>
<html lang="tr">

    <meta charset="utf-8" />
    <title>Sahne · Halil’in döşeme atölyesi</title>
    <!--
  Statik, betiksiz sahne: 344 × 300 sahne birimi (SceneDef sc_atolye). Yalnızca dekoratif div'ler.
  Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
      }
