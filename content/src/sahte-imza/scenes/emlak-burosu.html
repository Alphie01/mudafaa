<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Kılınç Gayrimenkul</title>
    <!--
  Dava #09: Erol’un bürosu; akvaryum, kasa, masa takvimi, makbuz koçanı, senet dosyası.
  Dokunma alanları SceneDef nesneleridir (scenes.ts). Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 380px;
        overflow: hidden;
        background: #141026;
        font-family: monospace;
        color: #efe8ff;
      }
      #scene div {
        position: absolute;
        box-sizing: border-box;
      }
      .k {
        border: 3px solid #120d1c;
      }
      .t {
        font-size: 9px;
        line-height: 10px;
        color: #120d1c;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div style="left: 0px; top: 0px; width: 344px; height: 220px; background: #2b2350"></div>
      <div
        style="left: 0px; top: 216px; width: 344px; height: 164px; background: #3a3046; border-top: 4px solid #120d1c"
      ></div>
      <div class="k" style="left: 20px; top: 100px; width: 100px; height: 80px; background: #2f6dbb"></div>
      <div style="left: 60px; top: 130px; width: 22px; height: 12px; background: #e2802f; border-radius: 6px"></div>
      <div class="k" style="left: 250px; top: 60px; width: 70px; height: 90px; background: #5c5a66"></div>
      <div
        class="k"
        style="left: 278px; top: 96px; width: 14px; height: 14px; background: #e8b13c; border-radius: 50%"
      ></div>
      <div class="k" style="left: 110px; top: 200px; width: 210px; height: 70px; background: #6b4a33"></div>
      <div class="k" style="left: 140px; top: 210px; width: 60px; height: 40px; background: #f4efe6"></div>
      <div style="left: 146px; top: 216px; width: 48px; height: 8px; background: #c4413a"></div>
      <div class="k" style="left: 220px; top: 220px; width: 70px; height: 40px; background: #e8dcc0"></div>
      <div style="left: 226px; top: 228px; width: 58px; height: 3px; background: #120d1c"></div>
      <div style="left: 226px; top: 236px; width: 58px; height: 3px; background: #120d1c"></div>
      <div class="k" style="left: 40px; top: 260px; width: 80px; height: 50px; background: #d9b46a"></div>
      <div style="left: 48px; top: 268px; width: 64px; height: 4px; background: #120d1c"></div>
      <div class="k" style="left: 140px; top: 300px; width: 120px; height: 60px; background: #7d2e48"></div>
      <div
        style="
          left: 0px;
          top: 0px;
          width: 344px;
          height: 220px;
          background: radial-gradient(ellipse at 70% 0%, rgba(232, 177, 60, 0.15), transparent 60%);
        "
      ></div>
    </div>
  </body>
</html>
