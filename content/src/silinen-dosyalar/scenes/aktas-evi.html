<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sahne · Aktaşların evi (Nilüfer)</title>
<!--
  Dava #13: Aktaşların salonu ve mutfak köşesi. Dekoratif div'ler; dokunma alanları SceneDef nesneleridir:
  mutfak çekmecesi (30,260,90,50) · çalışma masası (180,200,130,60) · modem (250,110,60,40) ·
  Defne'nin resmi (40,60,70,70) · duvar saati (150,20,40,40). Palet: zemin #141026, duvar #2b2350, kenar #120d1c.
-->

body{margin:0;background:#141026}
#scene{position:relative;width:344px;height:380px;overflow:hidden;background:#141026;font-family:'Pixelify Sans',monospace;color:#efe8ff}
#scene div{position:absolute;box-sizing:border-box}
</style>
</head>

  <div style="left:0;right:0;top:300px;height:4px;background:#4a382c"></div>

  <div style="left:150px;top:320px;width:150px;height:40px;background:#7a2f45;border:3px solid #120d1c"></div>

</body>
</html>
