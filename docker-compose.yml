# Müdafaa — yerel altyapı: PostgreSQL 17 ve Redis 8.
#
#   npm run db:up        postgres (5432) + redis (6379); veri adlandırılmış volume'lerde kalıcıdır
#   npm run db:test:up   postgres-test (5434) + redis-test (6380); "test" profili, veri bellekte (tmpfs)
#   npm run db:down      dev ve test konteynerlerini ve ağı kaldırır; volume'ler kalır
#                        (volume'leri de silmek için: docker compose --profile test down -v)
#
# Portlar yalnızca 127.0.0.1'e açılır; kimlik bilgileri yalnızca yerel geliştirme içindir.
# Port doluysa repo kökündeki .env dosyasında POSTGRES_PORT / REDIS_PORT ile değiştir (DATABASE_URL / REDIS_URL de aynı portu kullanmalı).

# Sabit proje adı: git worktree gibi farklı dizinlerde de aynı konteyner ve volume'ler kullanılır.
name: mudafaa

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mudafaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mudafaa}
      POSTGRES_DB: mudafaa
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP (-h 127.0.0.1) ile denenir: ilk açılışta initdb sırasındaki geçici sunucu yalnızca unix soketini dinler.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'mudafaa', '-d', 'mudafaa']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    # noeviction: BullMQ işleri bellek dolsa bile sessizce silinmesin.
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # Üretim profili: API konteyneri + Cloudflare tüneli (mudafaa.sehirkilavuzu.com → api:3000).
  #   docker compose --profile prod up -d --build
  # Gerekenler: apps/api/.env.production (bkz. apps/api/production.env.example) ve kökteki .env'de CLOUDFLARE_TUNNEL_TOKEN.
  api:
    profiles: ['prod']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env.production
    environment:
      NODE_ENV: production
      APP_ROLE: all
      TRUST_PROXY: '1'
      DATABASE_URL: postgresql://mudafaa:${POSTGRES_PASSWORD:-mudafaa}@postgres:5432/mudafaa
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - assets:/app/apps/api/storage
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  tunnel:
    profiles: ['prod']
    image: cloudflare/cloudflared:2024.12.2
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Test profili: `npm run db:test:up` ile açılır, geliştirme verisine dokunmaz.
  postgres-test:
    profiles: ['test']
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mudafaa
      POSTGRES_PASSWORD: mudafaa
      POSTGRES_DB: mudafaa_test
    ports:
      - '127.0.0.1:5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'mudafaa', '-d', 'mudafaa_test']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    profiles: ['test']
    image: redis:8-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  assets:
