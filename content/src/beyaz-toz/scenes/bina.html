<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Ihlamur Sokak 14, bina girişi</title>
    <!--
  Statik, betiksiz sahne: 344 × 300 sahne birimi (SceneDef sc_bina). Bina girişi, posta kutuları, köşedeki park yeri.
-->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #141026;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- dış cephe -->
      <div style="left: 0; top: 0; width: 344px; height: 240px; background: #4a4030"></div>
      <div style="left: 0; top: 0; width: 344px; height: 12px; background: #120d1c"></div>
      <!-- kaldırım -->
      <div
        style="left: 0; top: 240px; width: 344px; height: 60px; background: #2e2a36; border-top: 4px solid #120d1c"
      ></div>
      <div style="left: 0; top: 284px; width: 344px; height: 2px; background: #4f5560"></div>
      <!-- giriş kapısı -->
      <div
        style="left: 96px; top: 60px; width: 110px; height: 180px; background: #2b2350; border: 4px solid #120d1c"
      ></div>
      <div style="left: 104px; top: 70px; width: 94px; height: 110px; background: #1b2440"></div>
      <div style="left: 150px; top: 70px; width: 3px; height: 110px; background: #120d1c"></div>
      <!-- merdiven otomatiği -->
      <div
        style="left: 150px; top: 100px; width: 18px; height: 22px; background: #cfc9c1; border: 2px solid #120d1c"
      ></div>
      <div style="left: 156px; top: 106px; width: 6px; height: 8px; background: #e8b13c"></div>
      <!-- posta kutuları -->
      <div
        style="left: 26px; top: 86px; width: 64px; height: 100px; background: #7d8590; border: 3px solid #120d1c"
      ></div>
      <div
        style="left: 30px; top: 92px; width: 26px; height: 26px; background: #5c5a66; border: 1px solid #120d1c"
      ></div>
      <div
        style="left: 60px; top: 92px; width: 26px; height: 26px; background: #5c5a66; border: 1px solid #120d1c"
      ></div>
      <div
        style="left: 30px; top: 126px; width: 42px; height: 30px; background: #5c5a66; border: 2px solid #e8b13c"
      ></div>
      <div style="left: 34px; top: 132px; width: 30px; height: 6px; background: #f4efe6"></div>
      <div style="left: 34px; top: 142px; width: 26px; height: 4px; background: #2f5a96"></div>
      <div
        style="left: 30px; top: 160px; width: 26px; height: 22px; background: #5c5a66; border: 1px solid #120d1c"
      ></div>
      <!-- zemin kat penceresi ve kedi -->
      <div
        style="left: 240px; top: 60px; width: 76px; height: 70px; background: #e8b13c; border: 4px solid #120d1c"
      ></div>
      <div style="left: 244px; top: 64px; width: 30px; height: 62px; background: #b0496b"></div>
      <div style="left: 286px; top: 112px; width: 18px; height: 14px; background: #3b2f2a"></div>
      <div style="left: 288px; top: 106px; width: 4px; height: 6px; background: #3b2f2a"></div>
      <div style="left: 298px; top: 106px; width: 4px; height: 6px; background: #3b2f2a"></div>
      <!-- korkuluk ve park yeri -->
      <div style="left: 214px; top: 200px; width: 126px; height: 4px; background: #25222e"></div>
      <div style="left: 220px; top: 204px; width: 4px; height: 40px; background: #25222e"></div>
      <div style="left: 300px; top: 204px; width: 4px; height: 40px; background: #25222e"></div>
      <div
        style="left: 296px; top: 214px; width: 12px; height: 12px; border: 2px solid #b0b8c4; border-radius: 8px"
      ></div>
      <div style="left: 224px; top: 254px; width: 84px; height: 22px; background: #141018; border-radius: 40%"></div>
      <!-- izmaritler -->
      <div style="left: 140px; top: 268px; width: 8px; height: 3px; background: #f4efe6"></div>
      <div style="left: 156px; top: 272px; width: 8px; height: 3px; background: #f4efe6"></div>
      <div style="left: 168px; top: 266px; width: 8px; height: 3px; background: #e8b13c"></div>
      <!-- yağmur -->
      <div style="left: 40px; top: 20px; width: 1px; height: 30px; background: #6a7aa0"></div>
      <div style="left: 200px; top: 30px; width: 1px; height: 26px; background: #6a7aa0"></div>
      <div style="left: 320px; top: 150px; width: 1px; height: 30px; background: #6a7aa0"></div>
    </div>
  </body>
</html>
