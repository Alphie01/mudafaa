<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Müdafaa — Karar ve Skor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#e8b13c}a:hover{color:#ffd36b}
.pxbtn{box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.22), 4px 4px 0 #120d1c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1d1733; font-family: 'VT323', monospace; color: #efe8ff; display: flex; flex-direction: column">
  <header style="padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column">
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 12px; color: #b3a8d6; letter-spacing: 2px">DAVA #07 · HÜKÜM</span>
      <h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 700; color: #e8b13c">Karar Açıklandı</h1>
    </div>
    <span style="font-family: 'Pixelify Sans', monospace; font-size: 12px; color: #b3a8d6">STRATEJİ: MASUMİYET</span>
  </header>

  <section aria-label="Hüküm" style="position: relative; margin: 0 20px; height: 150px; background: #4a2f24; border: 3px solid #120d1c; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #6b4630; border-top: 6px solid #8a5c3e"></div>
    <div style="position: absolute; left: 22px; top: 32px"><dc-import name="Sprite" who="hakim" px="4" hint-size="64px,80px"></dc-import></div>
    <div style="position: absolute; right: 18px; top: 42px"><dc-import name="Sprite" who="muvekkil" px="4" hint-size="64px,80px"></dc-import></div>
    <div style="position: absolute; left: 50%; top: 30px; transform: translateX(-50%) rotate(-6deg); padding: 6px 14px; background: {{stampBg}}; color: #ffffff; border: 4px solid #120d1c; box-shadow: 4px 4px 0 #120d1c; font-family: 'Pixelify Sans', monospace; font-size: 34px; font-weight: 700; letter-spacing: 2px; white-space: nowrap">{{stamp}}</div>
    <div style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; font-size: 19px; color: #f4e7c5; white-space: nowrap">
      <span>Talep: 5 yıl</span><span aria-hidden="true">›</span><b style="color: #ffffff">{{sentence}}</b>
    </div>
  </section>

  <p style="margin: 12px 20px 0; padding: 10px 12px; background: #f4e7c5; color: #120d1c; border: 3px solid #120d1c; font-size: 19px; line-height: 1.05">{{verdict}}</p>

  <section aria-label="Skor dökümü" style="margin: 12px 20px 0; padding: 10px 12px; background: #2b2350; border: 3px solid #120d1c; display: flex; flex-direction: column; gap: 3px">
    <h2 style="margin: 0 0 4px; font-family: 'Pixelify Sans', monospace; font-size: 12px; letter-spacing: 1px; color: #b3a8d6">SKOR DÖKÜMÜ</h2>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; justify-content: space-between; font-size: 19px; line-height: 1.1">
        <span>{{r.label}}</span><span style="color: {{r.color}}">{{r.value}}</span>
      </div>
    </sc-for>
    <div style="display: flex; justify-content: space-between; margin-top: 4px; padding-top: 6px; border-top: 3px dashed #4a3f7a; font-family: 'Pixelify Sans', monospace; font-size: 18px; font-weight: 700">
      <span>TOPLAM</span><span style="color: #e8b13c">{{total}}</span>
    </div>
  </section>

  <section aria-label="Karar eşikleri" style="margin: 12px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="position: relative; height: 18px; display: flex; gap: 2px; border: 3px solid #120d1c; background: #120d1c">
      <div style="width: 40%; background: #a4321f"></div>
      <div style="width: 24%; background: #b07a12"></div>
      <div style="flex: 1; background: #2e7a4c"></div>
      <div style="position: absolute; left: {{marker}}; top: -8px; width: 6px; height: 28px; margin-left: -3px; background: #ffffff; border: 2px solid #120d1c"></div>
    </div>
    <div style="display: flex; font-size: 16px; color: #b3a8d6">
      <span style="width: 40%">Mahkûmiyet</span><span style="width: 24%">İndirim</span><span style="flex: 1; text-align: right">Beraat 3.200+</span>
    </div>
  </section>

  <div style="margin: 10px 20px 0; display: flex; justify-content: space-between; font-size: 18px">
    <span>Rütbe puanı <b style="color: #e8b13c">{{xp}}</b></span>
    <span style="color: #b3a8d6">Stajyer › Avukat: 64%</span>
  </div>

  <div style="margin-top: auto; padding: 12px 20px 26px; display: flex; gap: 12px">
    <a href="Dosya.dc.html" class="pxbtn" style="flex: 1; display: flex; justify-content: center; align-items: center; height: 58px; background: #3a2f66; color: #efe8ff; text-decoration: none; border: 3px solid #120d1c; font-family: 'Pixelify Sans', monospace; font-size: 16px">TEKRAR OYNA</a>
    <a href="Davalar.dc.html" class="pxbtn" style="flex: 1.4; display: flex; justify-content: center; align-items: center; height: 58px; background: #e8b13c; color: #120d1c; text-decoration: none; border: 3px solid #120d1c; font-family: 'Pixelify Sans', monospace; font-size: 17px; font-weight: 700">SONRAKİ DAVA ›</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"outcome":{"editor":"enum","options":["beraat","indirim","mahkumiyet"],"default":"beraat"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = '#6fd08d', Y = '#e8b13c', R = '#ef7a66', W = '#efe8ff';
    const O = {
      beraat: {
        stamp: 'BERAAT', stampBg: '#2e7a4c', sentence: 'Ceza yok',
        verdict: 'Sanık Kerem Aydın’ın üzerine atılı suçu işlediği sabit olmadığından CMK 223/2-e uyarınca BERAATİNE karar verildi.',
        rows: [['Delil toplama (5/6)', '+1.200', W], ['Çapraz sorgu', '+1.350', W], ['İtiraz isabeti (6/7)', '+600', G], ['Güvenilirlik bonusu (4♥)', '+400', G], ['Hatalı delil (1)', '−150', R]],
        total: 3400, xp: '+340'
      },
      indirim: {
        stamp: 'İNDİRİM', stampBg: '#b07a12', sentence: '2 yıl 6 ay',
        verdict: 'Sanığın TCK 142/1 uyarınca cezalandırılmasına, TCK 62 ile takdiren indirim uygulanarak 2 YIL 6 AY HAPİS cezası verildi.',
        rows: [['Delil toplama (3/6)', '+900', W], ['Çapraz sorgu', '+950', W], ['İtiraz isabeti (4/7)', '+400', G], ['Güvenilirlik bonusu (2♥)', '+200', G], ['Hatalı delil (2)', '−300', R]],
        total: 2150, xp: '+180'
      },
      mahkumiyet: {
        stamp: 'MAHKÛMİYET', stampBg: '#a4321f', sentence: '5 yıl hapis',
        verdict: 'Sanığın TCK 142/1 uyarınca 5 YIL HAPİS cezası ile cezalandırılmasına karar verildi. İstinaf yolu açık.',
        rows: [['Delil toplama (2/6)', '+600', W], ['Çapraz sorgu', '+500', W], ['İtiraz isabeti (2/7)', '+200', Y], ['Güvenilirlik bonusu (0♥)', '+0', Y], ['Hatalı delil (4)', '−600', R]],
        total: 700, xp: '+40'
      }
    };
    const o = O[this.props.outcome] || O.beraat;
    const fmt = (n) => n.toLocaleString('tr-TR');
    return {
      stamp: o.stamp, stampBg: o.stampBg, sentence: o.sentence, verdict: o.verdict, xp: o.xp,
      rows: o.rows.map((r) => ({ label: r[0], value: r[1], color: r[2] })),
      total: fmt(o.total),
      marker: Math.min(100, (o.total / 5000) * 100).toFixed(1) + '%'
    };
  }
}
</script>
</body>
</html>
