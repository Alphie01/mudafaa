<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Gökdere kavşağı, 14 Kasım gece</title>
    <!-- Statik, betiksiz sahne: 344 × 300 sahne birimi. Dokunma alanları SceneDef nesnelerindedir. -->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #0d0a1c;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- gökyüzü ve binalar -->
      <div style="left: 0; top: 0; width: 344px; height: 150px; background: #141026"></div>

      <div style="left: 0; top: 160px; width: 344px; height: 6px; background: #4a4656"></div>
      <!-- yaya geçidi -->

      <div style="left: 62px; top: 264px; width: 36px; height: 16px; background: #4f5560; border: 2px solid #120d1c"></div>
