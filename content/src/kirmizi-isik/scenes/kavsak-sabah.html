<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Sahne · Gökdere kavşağı, bugün</title>
    <!-- Statik, betiksiz sahne: 344 × 300 sahne birimi. Dokunma alanları SceneDef nesnelerindedir. -->
    <style>
      body {
        margin: 0;
        background: #141026;
      }
      #scene {
        position: relative;
        width: 344px;
        height: 300px;
        overflow: hidden;
        background: #9cc3e6;
      }
      #scene div {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <!-- gri şubat göğü -->
      <div style="left: 0; top: 0; width: 344px; height: 140px; background: #7d8590"></div>
      <!-- büfe -->
      <div style="left: 0; top: 60px; width: 92px; height: 160px; background: #6a4a9c; border-right: 3px solid #120d1c"></div>
      <div style="left: 0; top: 44px; width: 100px; height: 16px; background: #c4413a; border-bottom: 3px solid #120d1c"></div>
      <div style="left: 40px; top: 52px; width: 30px; height: 22px; background: #25222e; border: 2px solid #120d1c"></div>
      <div style="left: 64px; top: 58px; width: 8px; height: 8px; background: #c0392b"></div>
      <div style="left: 12px; top: 100px; width: 66px; height: 50px; background: #e6c46a; border: 2px solid #120d1c"></div>
      <!-- reklam panosu -->
      <div style="left: 96px; top: 40px; width: 54px; height: 70px; background: #e2802f; border: 3px solid #120d1c"></div>
      <div style="left: 118px; top: 110px; width: 6px; height: 60px; background: #4f5560"></div>
      <!-- binalar -->
      <div style="left: 160px; top: 30px; width: 184px; height: 120px; background: #4a4656"></div>
      <div style="left: 180px; top: 50px; width: 20px; height: 20px; background: #cfc9c1"></div>
      <div style="left: 230px; top: 50px; width: 20px; height: 20px; background: #cfc9c1"></div>
      <div style="left: 280px; top: 50px; width: 20px; height: 20px; background: #cfc9c1"></div>
      <!-- kaldırım ve yol -->
      <div style="left: 0; top: 220px; width: 344px; height: 80px; background: #5c5a66"></div>
      <div style="left: 0; top: 214px; width: 344px; height: 6px; background: #cfc9c1"></div>
      <!-- sinyal direği ve butonu -->
      <div style="left: 186px; top: 100px; width: 6px; height: 114px; background: #4f5560"></div>
      <div style="left: 176px; top: 70px; width: 26px; height: 40px; background: #120d1c"></div>
      <div style="left: 183px; top: 96px; width: 12px; height: 10px; background: #3f8a62"></div>
      <div style="left: 198px; top: 176px; width: 16px; height: 20px; background: #e8b13c; border: 2px solid #120d1c"></div>
      <!-- çiçekler -->
      <div style="left: 162px; top: 176px; width: 26px; height: 32px; background: #f4efe6; border: 2px solid #7d8590"></div>
      <div style="left: 168px; top: 170px; width: 6px; height: 8px; background: #c4413a"></div>
      <div style="left: 178px; top: 172px; width: 6px; height: 8px; background: #c4413a"></div>
      <!-- kontrol kabini -->
      <div style="left: 250px; top: 150px; width: 48px; height: 70px; background: #7d8590; border: 3px solid #120d1c"></div>
      <div style="left: 262px; top: 168px; width: 24px; height: 14px; background: #f4efe6"></div>
      <!-- yaya geçidi -->
      <div style="left: 40px; top: 240px; width: 260px; height: 8px; background: #f4efe6"></div>
      <div style="left: 40px; top: 260px; width: 260px; height: 8px; background: #f4efe6"></div>
      <div style="left: 40px; top: 280px; width: 260px; height: 8px; background: #f4efe6"></div>
    </div>
  </body>
</html>
